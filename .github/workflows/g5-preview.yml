name: G5 Trust Roadmap Preview Verify

on:
  push:
    branches:
      - g5-trust-roadmap-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g5-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Report SHA under test
        run: |
          echo "Event SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install dependencies (no lockfile present)
        run: npm install --no-audit --no-fund

      - name: Validate G1 data
        run: npm run validate

      - name: Run tests (G1 + G3)
        run: npm test

      - name: Build (Astro static)
        run: npm run build

      - name: Validate all rendered routes and security assets
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const routes = ['index','catalogo','contacto','contenidos','nosotros','ruta'];
          const assets = new Set();
          for (const route of routes) {
            const file = route === 'index' ? 'dist/index.html' : `dist/${route}/index.html`;
            const html = fs.readFileSync(file, 'utf8');
            if (!/^<!doctype html>/i.test(html) || !/<head[\s>]/i.test(html)) throw new Error(`${file}: missing rendered HTML head`);
            if (/import\s+Layout|<Layout\b/.test(html)) throw new Error(`${file}: leaked Astro source`);
            if (!/<link[^>]+rel=["']stylesheet["'][^>]+href=/i.test(html)) throw new Error(`${file}: missing stylesheet reference`);
            if (/<script\b(?![^>]*\bsrc=)[^>]*>/i.test(html)) throw new Error(`${file}: inline script blocked by CSP`);
            if (!/<script[^>]+src=["']\/scripts\/mobile-nav\.js["']/i.test(html)) throw new Error(`${file}: expected external mobile navigation script missing`);
            if (/\son[a-z]+\s*=/i.test(html)) throw new Error(`${file}: inline event handler`);
            for (const [, src] of html.matchAll(/<(?:script|link)[^>]+(?:src|href)=["']([^"']+)["']/gi)) {
              if (src.startsWith('/_astro/')) assets.add(`dist${src}`);
            }
          }
          for (const file of assets) if (!fs.existsSync(file)) throw new Error(`missing referenced asset: ${file}`);
          const navScript = fs.readFileSync('dist/scripts/mobile-nav.js', 'utf8');
          if (!navScript.includes('menu-toggle') || !navScript.includes('nav-mobile') || !navScript.includes('is-open')) throw new Error('mobile navigation behavior not found in dist/scripts/mobile-nav.js');
          const headers = fs.readFileSync('dist/_headers', 'utf8');
          for (const required of ['Content-Security-Policy:', 'X-Content-Type-Options: nosniff', 'Referrer-Policy:', 'X-Frame-Options: DENY', 'Permissions-Policy:', '! Access-Control-Allow-Origin']) {
            if (!headers.includes(required)) throw new Error(`dist/_headers: missing ${required}`);
          }
          console.log(`Validated ${routes.length} routes and ${assets.size} referenced build assets.`);
          SCRIPT

      - name: Upload compiled dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g5-trust-roadmap-preview-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Summary
        run: |
          echo "## G5 Trust Roadmap Preview Verify" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          ls -la screenshots/ >> "$GITHUB_STEP_SUMMARY" || true
