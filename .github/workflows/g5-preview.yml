name: G5 Trust Roadmap Preview Verify

on:
  push:
    branches:
      - g5-trust-roadmap-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g3-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report SHA under test
        run: |
          echo "Event SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate G1 data
        run: npm run validate

      - name: Run tests (G1 + G3)
        run: npm test

      - name: Build (Astro static)
        run: npm run build

      - name: Validate rendered G5 pages
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          for (const file of ['dist/index.html','dist/ruta/index.html','dist/contenidos/index.html']) {
            const html = fs.readFileSync(file, 'utf8');
            if (!/^<!doctype html>/i.test(html) || !/<head[\s>]/i.test(html)) throw new Error(`${file}: missing rendered HTML head`);
            if (/import\s+Layout|<Layout\b/.test(html)) throw new Error(`${file}: leaked Astro source`);
            if (!/<link[^>]+rel=["']stylesheet["'][^>]+href=/i.test(html)) throw new Error(`${file}: missing stylesheet reference`);
          }
          SCRIPT

      - name: Upload compiled dist
        uses: actions/upload-artifact@v4
        with:
          name: g5-trust-roadmap-preview-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Summary
        run: |
          echo "## G5 Trust Roadmap Preview Verify" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          ls -la screenshots/ >> "$GITHUB_STEP_SUMMARY" || true
